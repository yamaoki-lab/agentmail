dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap lmtp
listen = 127.0.0.1
ssl = no
auth_allow_cleartext = yes

log_path = /dev/stderr
info_log_path = /dev/stderr
mail_driver = maildir
mail_path = ~/Maildir
mailbox_list_index = yes

namespace inbox {
  inbox = yes
}

passdb passwd-file {
  passwd_file_path = /etc/dovecot/lab-users
}

userdb passwd-file {
  passwd_file_path = /etc/dovecot/lab-users
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
  }
}
