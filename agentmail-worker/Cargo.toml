[package]
name = "agentmail-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport"] }
libc = "0.2"
mailparse = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
